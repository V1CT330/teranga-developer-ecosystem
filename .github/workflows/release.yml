name: Create Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version without the v prefix, for example 1.1.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check && pnpm test && pnpm exec vite build --base=./
      - run: tar -czf developerhub-${{ inputs.version }}.tar.gz -C dist/public .
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ inputs.version }}" "developerhub-${{ inputs.version }}.tar.gz" --title "DeveloperHub v${{ inputs.version }}" --generate-notes
